<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GeoAlgMathe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>GeoAlgMathe</h1>
    <button id="theme-toggle" title="Toggle theme">🌙</button>
  </header>

  <canvas id="plot"></canvas>

  <div class="bottom-bar">
    <label for="expr">Expression</label>
    <input
      type="text"
      id="expr"
      placeholder="e.g. 3x, x^2 + 2, y - 3x = 5"
      autocomplete="off"
      spellcheck="false"
      value="3x"
    >
    <div id="result"></div>
  </div>

  <script type="module">
    window.addEventListener('DOMContentLoaded', () => {
      try {
        console.log('[bootstrap] DOM ready, loading main.js...');

        // 页面可见错误报告：兜底用，确保控制台关闭时用户也能看到
        function reportError(msg, err) {
          const el = document.getElementById('result');
          if (el) {
            el.textContent = '✗ ' + msg;
            el.classList.add('error');
          }
          // 同时打控制台
          console.error('[bootstrap]', msg, err);
          if (err && err.stack) console.error('[bootstrap] stack:', err.stack);
        }

        import('./main.js')
          .then(() => {
            console.log('[bootstrap] main.js loaded successfully');
          })
          .catch(err => {
            reportError('Failed to load/execute main.js: ' + (err && err.message), err);
          });
      } catch (err) {
        // 同步兜底
        const el = document.getElementById('result');
        if (el) {
          el.textContent = '✗ Critical error: ' + (err && err.message);
          el.classList.add('error');
        }
        console.error('[bootstrap] critical sync error:', err);
        if (err && err.stack) console.error('[bootstrap] stack:', err.stack);
      }
    });
  </script>
</body>
</html>
